<title>FREE ONE | fashion store</title>
<style>
  :root{
    --silver:#C9C9CE;
    --silver-light:#ECECF0;
    --silver-deep:#8A8A90;
    --paper:#EDEBE5;
    --ink:#050505;
    --ink-2:#111111;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;width:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:var(--ink);
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    touch-action:manipulation;
  }
  button{font-family:inherit;}

  /* ---------- Main page (revealed behind the shirt) ---------- */
  .stage{
    position:fixed;
    inset:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    background:
      radial-gradient(560px 420px at 50% 6%, rgba(201,201,206,.10), rgba(201,201,206,0) 60%),
      radial-gradient(900px 700px at 50% 108%, rgba(201,201,206,.07), rgba(201,201,206,0) 55%),
      var(--ink);
  }
  .brand{
    position:absolute;
    left:0;right:0;
    top:calc(env(safe-area-inset-top, 0px) + 9vh);
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    translate:0 -12px;
    transition:opacity .55s ease .1s, translate .55s cubic-bezier(.19,1,.22,1) .1s;
  }
  .brand.show{opacity:1;translate:0 0;}
  .logo-card{
    width:166px;
    height:166px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:
      0 20px 40px rgba(0,0,0,.6),
      0 0 0 3px rgba(201,201,206,.8),
      0 0 34px rgba(201,201,206,.22);
  }
  .logo-card img{width:100%;height:100%;object-fit:cover;display:block;}

  .actions{
    position:absolute;
    left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 20px;
  }
  .btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:340px;
    height:74px;
    padding:7px 24px 7px 7px;
    border-radius:999px;
    background:linear-gradient(155deg,#1a1a1a,#0a0a0a);
    box-shadow:
      0 14px 30px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(201,201,206,.22);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, opacity .5s ease .15s, translate .5s cubic-bezier(.19,1,.22,1) .15s, box-shadow .2s ease;
    opacity:0;
    translate:0 14px;
  }
  .actions.show .btn{opacity:1;translate:0 0;}
  .actions.show .btn:nth-of-type(1){transition-delay:.18s;}
  .actions.show .btn:nth-of-type(2){transition-delay:.29s;}
  .actions.show .btn:nth-of-type(3){transition-delay:.40s;}
  .actions.show .btn:nth-of-type(4){transition-delay:.51s;}
  .actions.show .btn:nth-of-type(5){transition-delay:.62s;}
  .btn:active{
    transform:scale(.965);
    box-shadow:
      0 10px 22px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(201,201,206,.55);
  }
  .badge{
    width:60px;
    height:60px;
    border-radius:18px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    overflow:hidden;
    padding:5px;
    box-shadow:0 0 0 2px rgba(201,201,206,.55);
  }
  .badge img{width:100%;height:100%;object-fit:contain;display:block;}
  .label{
    flex:1;
    text-align:center;
    color:#EFEFEF;
    font-weight:700;
    font-size:17px;
    letter-spacing:.3px;
    white-space:nowrap;
  }

  /* ---------- Shirt / zipper reveal overlay ---------- */
  .shirt-overlay{
    position:fixed;
    inset:0;
    z-index:500;
    overflow:hidden;
    touch-action:none;
  }
  .shirt-overlay.opened{
    pointer-events:none;
    transition:opacity .4s ease .1s;
    opacity:0;
  }
  .flap{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transition:transform .5s cubic-bezier(.19,1,.22,1);
    will-change:transform;
  }
  .shirt-overlay.dragging .flap{transition:none;}
  .flap svg{width:100%;height:100%;display:block;}
  .flap-l{clip-path:inset(0 50% 0 0); transform:translateX(calc(var(--openness,0) * -50%));}
  .flap-r{clip-path:inset(0 0 0 50%); transform:translateX(calc(var(--openness,0) * 50%));}

  .zip-pull{
    all:unset;
    position:absolute;
    left:50%;
    top:calc(env(safe-area-inset-top, 0px) + 4% + (var(--openness,0) * 60%));
    transform:translate(-50%,-14%) scale(1);
    width:64px;
    height:84px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    cursor:grab;
    transition:top .5s cubic-bezier(.19,1,.22,1);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));
    animation:pullHint 1.9s ease-in-out infinite;
  }
  .shirt-overlay.dragging .zip-pull{transition:none; cursor:grabbing; animation:none;}
  .shirt-overlay.opened .zip-pull{transition:top .5s cubic-bezier(.19,1,.22,1), opacity .3s ease;}
  @keyframes pullHint{
    0%,100%{transform:translate(-50%,-14%) translateY(0);}
    50%{transform:translate(-50%,-14%) translateY(5px);}
  }
  .zip-pull svg{width:34px;height:48px;pointer-events:none;}

  .hint{
    position:absolute;
    left:0;right:0;
    top:calc(env(safe-area-inset-top, 0px) + 4% + 60% + 70px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:var(--silver-light);
    opacity:.85;
    transition:opacity .35s ease;
    pointer-events:none;
  }
  .shirt-overlay.dragging .hint,
  .shirt-overlay.opened .hint{opacity:0;}
  .hint .chevron{
    color:var(--silver-light);
    animation:chevDown 1.4s ease-in-out infinite;
  }
  @keyframes chevDown{
    0%,100%{transform:translateY(0); opacity:.55;}
    50%{transform:translateY(4px); opacity:1;}
  }
  .hint span.txt{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.3px;
    white-space:nowrap;
  }

  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion:reduce){
    .zip-pull{animation:none;}
    .hint .chevron{animation:none;}
  }
</style>
</head>
<body>

  <div class="stage" id="stage">

    function reveal(){
      if (opened) return;
      opened = true;
      setOpenness(1);
      overlay.classList.add('opened');
      brand.classList.add('show');
      actions.classList.add('show');
      setTimeout(function(){ overlay.style.display = 'none'; }, 550);
    }

    function settle(target){
      setOpenness(target);
      if (target === 1){ reveal(); }
    }

    function onDown(e){
      if (opened) return;
      dragging = true;
      moved = false;
      startY = e.clientY;
      startOpenness = openness;
      overlay.classList.add('dragging');
      try{ pull.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    }

    function onMove(e){
      if (!dragging) return;
      var dy = e.clientY - startY;
      if (Math.abs(dy) > 4) moved = true;
      var range = Math.max(220, window.innerHeight * 0.4);
      setOpenness(startOpenness + dy / range);
    }

    function onUp(e){
      if (!dragging) return;
      dragging = false;
      overlay.classList.remove('dragging');
      if (!moved){ settle(1); return; }
      settle(openness > 0.42 ? 1 : 0);
    }

    pull.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);

    pull.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        settle(1);
      }
    });

    skipBtn.addEventListener('click', function(){ settle(1); });
  })();
</script>
</body>
</html>
